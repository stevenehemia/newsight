spring:
  application:
    name: newsight
  http:
    clients:
      # Applies to every news source. A provider that hangs counts as failed, so the other
      # sources still answer instead of the whole search waiting on it.
      connect-timeout: 3s
      read-timeout: 5s

newsight:
  sources:
    nyt:
      # From the NYT_API_KEY environment variable. Empty switches the NYT source off.
      api-key: ${NYT_API_KEY:}
    guardian:
      api-key: ${GUARDIAN_API_KEY:}
